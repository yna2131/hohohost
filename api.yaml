openapi: 3.0.4
info: 
  title: hohohost api
  version: v1
paths:
  /wish:
      get: 
        description: returns the wish list of the user
        responses:
          200: 
            description: successfully get the wish
            content:
              application/json: 
                schema: 
                  type: array
                  items:
                    $ref: "#/components/schemas/Wish"
      post:
        description: create new wish
        responses:
          201:
            description: successfully create new wish
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Wish"
        requestBody:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWishRequest"

  /wish/{wishId}:
    get: 
      description: returns a wish
      parameters:
        - name: wishId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200: 
          description: successfully get the wish
          content:
            application/json: 
              schema: 
                $ref: "#/components/schemas/Wish"
    put:
      description: updates an existing wish
      parameters:
        - name: wishId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: successfully updates the wish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wish"
    delete:
      description: deletes an existing wish
      parameters:
        - name: wishId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: successfully deletes the wish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wish"
  /:
    post:
      description: creates a new user
      responses:
        200:
          description: successfully creates the new user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserRequest"

  /{userId}:
    get:
      description: returns the user detail
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: successfully returns the user detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      description: updates user detail
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: successfully updates the user detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
      
components:
  schemas:
    Wish:
      type: object
      required:
        - id
        - userId
        - giftName
        - price
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        giftName:
          type: string
        price:
          type: number
          format: float
        url:
          type: string
          format: uri
    CreateWishRequest:
      type: object
      required:
        - userId
        - giftName
        - price
      properties:
        userId:
          type: string
          format: uuid
        giftName:
          type: string
        price:
          type: number
          format: float
        url:
          type: string
          format: uri
    User:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - password
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
            type: string
    CreateUserRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string